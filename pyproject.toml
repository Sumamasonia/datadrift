[project]
name = "datadrift"
version = "0.1.0"
description = "Automatic data quality monitoring for analytics pipelines"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "click>=8.1",
    "python-multipart>=0.0.9",
    "requests>=2.31",
]

[project.scripts]
datadrift = "datadrift.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datadrift"]
